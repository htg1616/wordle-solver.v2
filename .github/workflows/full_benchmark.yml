name: Full Benchmark (Exhaustive)

# 수동으로만 실행 (비용이 크므로 push에 자동 실행 X)
on:
  workflow_dispatch:
    inputs:
      chunk_count:
        description: '병렬 청크 수 (기본 26, 줄이면 각 job이 오래 걸림)'
        default: '26'
        required: false
      tracks:
        description: '테스트 트랙 (예: 1,2,3 또는 1)'
        default: '1,2,3'
        required: false
      seeds:
        description: '노이즈 시드 (예: 0 또는 0,1)'
        default: '0'
        required: false
      slow_threshold:
        description: '느린 단어 기준 시간(초)'
        default: '10.0'
        required: false

jobs:
  # ── 1단계: chunk_count개의 인덱스 배열 생성 ──────────────────────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: |
          COUNT="${{ inputs.chunk_count || '26' }}"
          INDICES=$(python3 -c "import json; print(json.dumps(list(range(int('$COUNT')))))")
          echo "matrix={\"chunk_index\":$INDICES}" >> "$GITHUB_OUTPUT"

  # ── 2단계: 각 청크 병렬 실행 ─────────────────────────────────────────────
  benchmark-chunk:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 340          # 5시간 40분 (6시간 제한 내 여유)
    strategy:
      fail-fast: false             # 한 청크 실패해도 나머지는 계속 실행
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 청크 벤치마크 실행
        run: |
          python benchmark/run_full_benchmark.py \
            --chunk-index ${{ matrix.chunk_index }} \
            --chunk-count ${{ inputs.chunk_count || '26' }} \
            --tracks "${{ inputs.tracks || '1,2,3' }}" \
            --seeds "${{ inputs.seeds || '0' }}" \
            --slow-threshold ${{ inputs.slow_threshold || '10.0' }} \
            --out-dir benchmark/results/chunk_${{ matrix.chunk_index }}

      - name: 결과 업로드 (실패해도 업로드)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-benchmark-chunk-${{ matrix.chunk_index }}
          # checkpoint.jsonl 도 업로드 → 부분 결과 복구 가능
          path: benchmark/results/chunk_${{ matrix.chunk_index }}/
          if-no-files-found: warn

  # ── 3단계: 전체 청크 결과 병합 ────────────────────────────────────────────
  merge-results:
    needs: benchmark-chunk
    runs-on: ubuntu-latest
    if: always()   # 일부 청크가 실패해도 완료된 것만 병합

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 청크 아티팩트 전체 다운로드
        uses: actions/download-artifact@v4
        with:
          pattern: full-benchmark-chunk-*
          path: benchmark/results/chunks/

      - name: 결과 병합
        run: |
          python - <<'EOF'
          import csv, json, pathlib, sys

          base = pathlib.Path("benchmark/results/chunks")
          all_rows = []
          slow_threshold = float("${{ inputs.slow_threshold || '10.0' }}")

          # 모든 청크의 games.csv를 읽어 병합
          first = True
          fields = None
          for games_csv in sorted(base.glob("*/games.csv")):
              with games_csv.open(newline="", encoding="utf-8") as f:
                  reader = csv.DictReader(f)
                  if fields is None:
                      fields = reader.fieldnames
                  for row in reader:
                      all_rows.append(row)

          if not all_rows:
              print("병합할 결과 없음", file=sys.stderr)
              sys.exit(0)

          out = pathlib.Path("benchmark/results/full_merged")
          out.mkdir(parents=True, exist_ok=True)

          # 병합 CSV
          with (out / "games.csv").open("w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              writer.writerows(all_rows)

          # 병합 JSONL
          with (out / "games.jsonl").open("w", encoding="utf-8") as f:
              for row in all_rows:
                  f.write(json.dumps(row, ensure_ascii=False) + "\n")

          # 느린 단어 병합
          slow_by_secret = {}
          for row in all_rows:
              try:
                  act_s = float(row.get("act_wall_s", 0))
              except (TypeError, ValueError):
                  act_s = 0.0
              if act_s > slow_threshold:
                  sec = row["secret"]
                  if sec not in slow_by_secret or act_s > slow_by_secret[sec]["max_act_wall_s"]:
                      slow_by_secret[sec] = {
                          "secret": sec,
                          "max_act_wall_s": round(act_s, 4),
                          "track": row["track"],
                          "seed": row["seed"],
                          "status": row.get("status", ""),
                          "score_turns": row.get("score_turns", ""),
                      }
          slow_list = sorted(slow_by_secret.values(), key=lambda x: -x["max_act_wall_s"])
          with (out / "slow_words.json").open("w", encoding="utf-8") as f:
              json.dump({"threshold_s": slow_threshold, "count": len(slow_list), "words": slow_list}, f, indent=2, ensure_ascii=False)

          # 실패 단어 병합
          failed_by_secret = {}
          for row in all_rows:
              if int(row.get("success", 1)) == 0:
                  sec = row["secret"]
                  failed_by_secret.setdefault(sec, []).append({
                      "track": row["track"],
                      "seed": row["seed"],
                      "status": row.get("status", ""),
                      "score_turns": row.get("score_turns", ""),
                      "act_wall_s": row.get("act_wall_s", ""),
                  })
          failed_list = sorted(
              [{"secret": k, "failures": v} for k, v in failed_by_secret.items()],
              key=lambda x: x["secret"],
          )
          with (out / "failed_words.json").open("w", encoding="utf-8") as f:
              json.dump({"count": len(failed_list), "words": failed_list}, f, indent=2, ensure_ascii=False)

          # 요약
          total = len(all_rows)
          solved = sum(1 for r in all_rows if int(r.get("success", 0)) == 1)
          summary = {
              "games": total,
              "solved": solved,
              "failed": total - solved,
              "success_rate": round(solved / total, 6) if total else 0.0,
              "slow_words_count": len(slow_list),
              "failed_words_count": len(failed_list),
          }
          with (out / "summary.json").open("w", encoding="utf-8") as f:
              json.dump(summary, f, indent=2, ensure_ascii=False)

          print(f"병합 완료: {total}게임, 성공 {solved} ({100*solved/total:.1f}%)")
          print(f"느린 단어: {len(slow_list)}개 (>{slow_threshold}s)")
          print(f"실패 단어: {len(failed_list)}개")
          EOF

      - name: 병합 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-benchmark-merged
          path: benchmark/results/full_merged/
